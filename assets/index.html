<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nexus</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://js.puter.com/v2/"></script>
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">
            <div class="logo-icon">N</div>
            <span>Nexus</span>
        </div>

        <button id="newChat" class="new-chat">
            ＋ Nuevo chat
        </button>

        <div class="history-title">
            Conversaciones
        </div>

        <div id="history" class="history"></div>

        <div class="sidebar-bottom">
            <div class="status">
                <span></span>
                Nexus está listo
            </div>
        </div>

    </aside>


    <main class="chat">

        <header class="topbar">

            <button id="menuButton" class="menu-button">
                ☰
            </button>

            <div class="top-title">
                <strong>Nexus</strong>
                <small>Asistente inteligente</small>
            </div>

            <!-- Selector de IA -->
            <select id="aiSelector" class="ai-selector">

                <option value="openai/gpt-5">
                    Chat gpt 5
                </option>

                <option value="anthropic/claude-sonnet-4">
                    Claude sonnet 4
                </option>

                <option value="google/gemini-2.5-pro">
                    Gemini 2.5
                </option>

            </select>

        </header>


        <section id="messages" class="messages"></section>


        <div class="input-area">

            <div class="input-box">

                <textarea
                    id="messageInput"
                    placeholder="Escribe un mensaje..."
                    rows="1"
                ></textarea>

                <button id="sendButton" class="send-button">
                    ➤
                </button>

            </div>

            <div class="disclaimer">
                Nexus puede cometer errores. Comprueba la información importante.
            </div>

        </div>

    </main>

</div>

<script src="script.js"></script>

</body>
</html>
