<!DOCTYPE html>
<html lang="es">
<head>
<script>
window.onerror=function(msg,src,line,col,err){window.parent.postMessage({type:'app-error',message:msg,source:src,lineno:line,colno:col,stack:err&&err.stack||''},'*');};
window.onunhandledrejection=function(e){window.parent.postMessage({type:'app-error',message:'Unhandled promise rejection: '+(e.reason&&e.reason.message||e.reason||'unknown'),stack:e.reason&&e.reason.stack||''},'*');};
window.addEventListener('error',function(e){var t=e&&e.target;if(t&&t!==window&&t.tagName==='SCRIPT'){var u=t.src||'';window.parent.postMessage({type:'app-error',message:'Failed to load script'+(u?': '+u:' (inline module)'),source:u},'*');}},true);
(function(){var _f=window.fetch;window.fetch=function(){var a=arguments,u=typeof a[0]==='string'?a[0]:(a[0]&&a[0].url)||'';var p=_f.apply(this,a);p.then(function(r){if(r.status===500){r.clone().text().then(function(b){window.parent.postMessage({type:'fetch-error',url:u,status:500,body:b},'*');}).catch(function(){window.parent.postMessage({type:'fetch-error',url:u,status:500,body:''},'*');});}}).catch(function(e){window.parent.postMessage({type:'fetch-error',url:u,status:0,body:e.message||'fetch failed'},'*');});return p;};})();
</script>
<script src="https://builder.puter.com/runtime.js" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#7c5cff">
    <meta name="description" content="Nexus — asistente inteligente con Nexus 1.3, GPT-5, Claude y Gemini.">

    <title>Nexus</title>

    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">

    <script src="https://js.puter.com/v2/"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- puter-pwa: generated, do not edit -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Nexus">
    <!-- /puter-pwa -->
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">
            <div class="logo-icon">N</div>
            <span>Nexus</span>
            <span class="version">1.3</span>
            <button id="closeSidebar" class="icon-btn close-sidebar" title="Cerrar"><i data-lucide="x"></i></button>
        </div>

        <button id="newChat" class="new-chat">
            <i data-lucide="plus"></i> Nuevo chat
        </button>

        <div class="history-title">
            Conversaciones
        </div>

        <div id="history" class="history"></div>

        <div class="sidebar-bottom">
            <button id="openSettings" class="side-link">
                <i data-lucide="settings-2"></i> Configurar soporte
            </button>
            <div id="authBox"></div>
            <div class="status">
                <span></span>
                <em id="statusText">Nexus está listo</em>
            </div>
        </div>

    </aside>

    <div id="overlay" class="overlay"></div>

    <main class="chat">

        <header class="topbar">

            <button id="menuButton" class="menu-button" title="Menú">
                <i data-lucide="menu"></i>
            </button>

            <div class="top-title">
                <strong id="topName">Nexus 1.3</strong>
                <small id="topSub">Asistente inteligente</small>
            </div>

            <!-- Selector de IA -->
            <select id="aiSelector" class="ai-selector">

                <optgroup label="Nexus 1.3">
                    <option value="nexus-chat">Nexus 1.3 · Asistente</option>
                    <option value="nexus-support">Nexus 1.3 · Soporte</option>
                    <option value="nexus-image">Nexus 1.3 · Imágenes</option>
                </optgroup>

                <optgroup label="Otras IAs">
                    <option value="openai/gpt-5">Chat GPT 5</option>
                    <option value="anthropic/claude-sonnet-4">Claude Sonnet 4</option>
                    <option value="google/gemini-2.5-pro">Gemini 2.5</option>
                </optgroup>

            </select>

        </header>


        <section id="messages" class="messages"></section>


        <div class="input-area">

            <div class="input-box">

                <textarea
                    id="messageInput"
                    placeholder="Escribe un mensaje..."
                    rows="1"
                ></textarea>

                <button id="sendButton" class="send-button" title="Enviar">
                    <i data-lucide="arrow-up"></i>
                </button>

            </div>

            <div class="disclaimer">
                Nexus puede cometer errores. Comprueba la información importante.
            </div>

        </div>

    </main>

</div>

<!-- Configuración del modo soporte -->
<div id="settingsModal" class="modal">
    <div class="modal-card">
        <div class="modal-head">
            <strong>Configurar Nexus 1.3 · Soporte</strong>
            <button class="icon-btn" data-close title="Cerrar"><i data-lucide="x"></i></button>
        </div>
        <div class="modal-body">
            <label>Nombre de tu negocio</label>
            <input id="bizName" placeholder="Ej. Mi Tienda">
            <label>Información para el asistente</label>
            <textarea id="bizInfo" rows="7" placeholder="Horarios, productos, precios, envíos, devoluciones, contacto..."></textarea>
            <p class="hint">Nexus 1.3 usará esta información para responder a tus clientes.</p>
        </div>
        <div class="modal-foot">
            <button class="btn-ghost" data-close>Cancelar</button>
            <button id="saveSettings" class="btn-primary">Guardar</button>
        </div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script type="module" src="script.js"></script>

</body>
</html>
